  const rows=[];
  document.querySelectorAll("section[data-case]").forEach(sec=>{
    const blocks=[...sec.querySelectorAll('[data-testid^="topbar-capacity-"]')];
    const widths=blocks.map(b=>b.offsetWidth);
    const bar=sec.querySelector(".viewport > span");
    const overflow=bar?bar.scrollWidth-bar.clientWidth:0;

  const t=document.getElementById("metrics");
